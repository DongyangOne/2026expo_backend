spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  mail:
    username: test@example.com
    auth:
      code-ttl-minutes: 5
      verified-ttl-minutes: 30

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

jwt:
  secret: test-test-test-test-test-test-test-test-test-test-test-test-test-test
  access-expiration: 3600000
  refresh-expiration: 1209600000

oauth:
  kakao:
    client-id: test-kakao-client-id
    client-secret: test-kakao-client-secret
  google:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
  naver:
    client-id: test-naver-client-id
    client-secret: test-naver-client-secret
    state: test-naver-state
