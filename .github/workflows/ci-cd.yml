name: Deploy Spring Boot

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

# Do not replace the production container from two workflow runs at once.
concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy develop to server
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_COMPOSE_DIR }}
          DEPLOY_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          command_timeout: 25m
          envs: DEPLOY_DIR,DEPLOY_SHA
          script: |
            set -eu

            DEPLOY_DIR="${DEPLOY_DIR:-$HOME/expo-backend}"
            case "$DEPLOY_DIR" in
              "~") DEPLOY_DIR="$HOME" ;;
              "~/"*) DEPLOY_DIR="$HOME/${DEPLOY_DIR#\~/}" ;;
            esac

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Git repository not found: $DEPLOY_DIR" >&2
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "Fetching the latest develop branch..."
            git fetch --prune origin \
              "+refs/heads/develop:refs/remotes/origin/develop"
            git switch -C deploy/develop origin/develop

            DEPLOYED_SHA="$(git rev-parse HEAD)"
            if [ -n "$DEPLOY_SHA" ] \
              && ! git merge-base --is-ancestor "$DEPLOY_SHA" "$DEPLOYED_SHA"; then
              echo "Triggered commit $DEPLOY_SHA is not included in $DEPLOYED_SHA" >&2
              exit 1
            fi
            echo "Deploying commit: $DEPLOYED_SHA"

            echo "Building Docker image..."
            docker build -t oneexpo-backend .

            ENV_FILE=/tmp/expo-backend.env
            if ! docker container inspect expo-backend >/dev/null 2>&1; then
              echo "Existing expo-backend container not found; cannot preserve production environment variables." >&2
              exit 1
            fi

            docker inspect \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              expo-backend > "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            if [ ! -s "$ENV_FILE" ]; then
              echo "Environment-variable backup is empty: $ENV_FILE" >&2
              exit 1
            fi

            docker network inspect expo-network >/dev/null 2>&1 \
              || docker network create expo-network

            echo "Replacing production container..."
            docker stop expo-backend
            docker rm expo-backend
            docker run -d \
              --name expo-backend \
              --restart unless-stopped \
              --network expo-network \
              --env-file "$ENV_FILE" \
              -e SPRING_PROFILES_ACTIVE=prod \
              -p 8080:8080 \
              oneexpo-backend

            echo "Waiting for Spring Boot..."
            READY=0
            for attempt in $(seq 1 40); do
              if [ "$(docker inspect --format '{{.State.Running}}' expo-backend 2>/dev/null || true)" != "true" ]; then
                echo "expo-backend stopped before becoming ready." >&2
                docker logs --tail 100 expo-backend || true
                exit 1
              fi

              if curl --fail --silent --show-error \
                http://localhost:8080/api-docs >/dev/null 2>&1; then
                READY=1
                break
              fi

              sleep 3
            done

            if [ "$READY" -ne 1 ]; then
              echo "Health check timed out: http://localhost:8080/api-docs" >&2
              docker logs --tail 100 expo-backend || true
              exit 1
            fi

            docker ps --filter name=expo-backend
            echo "Deployment completed: $DEPLOYED_SHA"
