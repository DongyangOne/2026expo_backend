name: Deploy Spring Boot

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Spring Boot Jar
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar --no-daemon

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "build/libs/*.jar,Dockerfile,docker-compose.yml"
          target: ${{ secrets.DEPLOY_COMPOSE_DIR }}

      - name: Deploy Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            cd "${{ secrets.DEPLOY_COMPOSE_DIR }}"

            docker network inspect whfwkr-network >/dev/null 2>&1 \
              || docker network create whfwkr-network

            docker compose \
              -f "${{ secrets.DEPLOY_COMPOSE_FILE }}" \
              up -d --build "${{ secrets.DEPLOY_SERVICE_NAME }}"

            docker compose \
              -f "${{ secrets.DEPLOY_COMPOSE_FILE }}" \
              ps