name: CI/CD

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Test
        run: ./gradlew clean test --no-daemon

      - name: Build jar
        run: ./gradlew bootJar -x test --no-daemon

  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        run: |
          IMAGE_NAME="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}:develop" \
            --tag "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ steps.image.outputs.image }}:develop"
          docker push "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"

  deploy:
    name: Deploy develop
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: develop

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE || '/opt/2026expo_backend/.env' }}
      DEPLOY_CONTAINER_NAME: ${{ secrets.DEPLOY_CONTAINER_NAME || '2026expo_backend' }}
      DEPLOY_HOST_PORT: ${{ secrets.DEPLOY_HOST_PORT || '8080' }}
      DEPLOY_CONTAINER_PORT: ${{ secrets.DEPLOY_CONTAINER_PORT || '8080' }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Validate deployment secrets
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY GHCR_USERNAME GHCR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy container
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "REGISTRY='${REGISTRY}' \
             IMAGE='${{ needs.docker.outputs.image }}:${{ needs.docker.outputs.tag }}' \
             CONTAINER_NAME='${DEPLOY_CONTAINER_NAME}' \
             HOST_PORT='${DEPLOY_HOST_PORT}' \
             CONTAINER_PORT='${DEPLOY_CONTAINER_PORT}' \
             ENV_FILE='${DEPLOY_ENV_FILE}' \
             GHCR_USERNAME='${GHCR_USERNAME}' \
             GHCR_TOKEN='${GHCR_TOKEN}' \
             bash -s" <<'EOF'
          set -euo pipefail

          if [ ! -f "${ENV_FILE}" ]; then
            echo "Missing env file on deploy host: ${ENV_FILE}" >&2
            exit 1
          fi

          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GHCR_USERNAME}" --password-stdin
          docker pull "${IMAGE}"

          docker stop "${CONTAINER_NAME}" || true
          docker rm "${CONTAINER_NAME}" || true

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            --env-file "${ENV_FILE}" \
            -p "${HOST_PORT}:${CONTAINER_PORT}" \
            "${IMAGE}"

          docker image prune -f
          EOF
